; ESP32 wake node for Raspberry Pi 5 (J2 + ALIVE) + path toward BME280 / TMC policy.
; Plan: BME280 only on ESP; forecaster + decider authorize wake; cameras only on Pi.
; Current board env is still esp32cam (interim firmware). Retarget board/pins when final ESP is chosen.
; Docs: ../config$awakening.md · ../plan.pdf

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
	-DBOARD_HAS_PSRAM
	-mfix=fp
board_build.partitions = huge_app.csv
upload_speed = 115200
