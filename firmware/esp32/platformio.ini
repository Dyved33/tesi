; Configurazione PlatformIO del firmware ESP32 (wake del Raspberry Pi 5 via J2 + lettura ALIVE).
; Per ora la board è la ESP32-CAM AI-Thinker usata come scheda provvisoria:
; quando sceglieremo l'ESP definitivo vanno cambiati board e pin.
; Documentazione: ../../docs/setup-risveglio.md
;
; Provenienza: scritta da noi. board = esp32cam, BOARD_HAS_PSRAM e la tabella
; huge_app.csv sono le impostazioni tipiche per la ESP32-CAM che si trovano
; nella documentazione PlatformIO (https://docs.platformio.org/en/latest/boards/espressif32/esp32cam.html)
; e in molti tutorial sulla ESP32-CAM.
; Il flag -mfix=fp va verificato (vedi issues.md).

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
	-DBOARD_HAS_PSRAM
	-mfix=fp
board_build.partitions = huge_app.csv
upload_speed = 115200
