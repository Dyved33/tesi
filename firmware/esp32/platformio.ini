; Configurazione PlatformIO del firmware ESP32: camera di bordo, lettura del
; BME280, invio delle misure al Raspberry Pi 5 via UART, wake del Pi via J2 e
; lettura di ALIVE.
; Scheda: ESP32-CAM con pinout AI-Thinker (camera collegata con il cavo
; flat al connettore della scheda).
; Documentazione: ../../docs/setup-risveglio.md
;
; Provenienza: scritta da noi. board = esp32cam, BOARD_HAS_PSRAM e la tabella
; huge_app.csv sono le impostazioni tipiche per la ESP32-CAM che si trovano
; nella documentazione PlatformIO (https://docs.platformio.org/en/latest/boards/espressif32/esp32cam.html)
; e in molti tutorial sulla ESP32-CAM.
; Per il BME280 usiamo la libreria SparkFun BME280 del registro PlatformIO
; (https://registry.platformio.org/libraries/sparkfun/SparkFun%20BME280).
; Non usiamo la Adafruit BME280: la sua dipendenza Adafruit Unified Sensor
; definisce un tipo sensor_t che va in conflitto con il driver della camera.
; Il flag -mfix=fp che c'era prima è stato tolto: il compilatore lo rifiuta
; ("unrecognized command-line option", vedi issues.md #25).

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
	-DBOARD_HAS_PSRAM
board_build.partitions = huge_app.csv
upload_speed = 115200
lib_deps =
	sparkfun/SparkFun BME280@^2.0.9
