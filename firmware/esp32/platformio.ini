; Firmware Arduino per la scheda ESP32-S3-CAM fotografata nel progetto:
; modulo ESP32-S3-N16R8 (16 MB flash, 8 MB PSRAM), con camera OV3660,
; due porte USB-C, slot SD e header a 40 pin. Il codice usa i servizi del Pi
; e il BME280; la logica della camera verrà aggiunta quando serve.
;
; Non esiste un'identificazione del produttore affidabile dalla serigrafia
; V1695 / 127294G_Y1127_231016. Usiamo quindi il profilo generico ESP32-S3
; DevKitC-1 come base PlatformIO e specifichiamo qui flash e PSRAM del modulo.
; I pin del BME280 e del collegamento Pi sono configurati in src/main.ino:
; vanno ricontrollati sullo schema della variante prima di cablare.
;
; La libreria SparkFun BME280 evita la dipendenza Adafruit Unified Sensor,
; che in passato entrava in conflitto con il driver della camera.

[env:esp32s3_cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
	-DBOARD_HAS_PSRAM
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
upload_speed = 115200
lib_deps =
	sparkfun/SparkFun BME280@^2.0.9
